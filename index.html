    <div class="addsection">
      <h3>ADD YOUR ANIME</h3>
      <button class="add">+

      <input type="text" placeholder="enter the name" id="name"><br>
      <label>Rating:</label>
      <input type="number" placeholder="Rating for you" id="rating"><br>
      <button class="submit">Submit</button>
    </div>
